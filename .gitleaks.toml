# Keep every default detector. One documented prose token is exempt from one rule.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Prose 'duplicate/missing' in docs/phase2_evidence.md is not a credential"
condition = "AND"
paths = ['''^docs/phase2_evidence\.md$''']
regexTarget = "secret"
regexes = ['''^duplicate/missing$''']

[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-audit"
version = "0.1.0"
description = "Deterministic spatial audit primitives for synthetic GPS observations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pyproj==3.8.0", "shapely==2.2.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[project.scripts]
geo-audit = "geo_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geo_audit", "geo_audit.*", "geo_audit_synthetic", "geo_audit_synthetic.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

name: GeoAudit CI
run-name: GeoAudit CI · ${{ github.ref_name }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test, verify and build evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GEO_AUDIT_TARGET: corrected
      EVIDENCE: .scratch/ci
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: make install PYTHON=python

      - name: Lint and check formatting
        run: make lint

      - name: Run test suite
        run: |
          mkdir -p "$EVIDENCE"
          .venv/bin/python -m pytest tests --junitxml="$EVIDENCE/pytest.xml"

      - name: Verify fix (legacy fails, corrected passes)
        run: make verify RG_OUT="$EVIDENCE/red_green"

      - name: Regenerate outputs and compare to references
        run: make demo DEMO_OUT="$EVIDENCE/demo"

      - name: Check reference files are unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-audit-evidence
          path: .scratch/ci
          if-no-files-found: error
          include-hidden-files: true
